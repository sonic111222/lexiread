name: build-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build portable executable
        run: python -m PyInstaller --clean --noconfirm lexiread.spec

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/LexiRead.exe release/
          Copy-Item README.md, README_EN.md, LICENSE, AUTHORS.md, NOTICE, COMMERCIAL.md, PRIVACY.md, SECURITY.md, THIRD_PARTY_NOTICES.md release/
          Copy-Item docs/WINDOWS_QUICKSTART.txt release/README-Windows.txt
          Copy-Item -Recurse LICENSES release/
          Compress-Archive -Path release/* -DestinationPath LexiRead-windows.zip -Force
          $hash = (Get-FileHash LexiRead-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  LexiRead-windows.zip" | Out-File -FilePath LexiRead-windows.zip.sha256 -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexiRead-windows
          path: |
            LexiRead-windows.zip
            LexiRead-windows.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LexiRead-windows.zip
            LexiRead-windows.zip.sha256
          generate_release_notes: true
