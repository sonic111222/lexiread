name: deploy-pwa-pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Cache PWA vendor assets
        uses: actions/cache@v4
        with:
          path: pwa_vendor
          key: pwa-vendor-${{ hashFiles('tools/fetch_pwa_vendor.py') }}
      - name: Fetch PWA vendor assets
        run: python tools/fetch_pwa_vendor.py
      - name: Build PWA
        run: python tools/build_pwa.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist_pwa

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
